<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Reveal Guessing Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            text-align: center;
            background: rgba(255,255,255,0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 10;
            max-width: 90%;
            width: 500px;
        }

        h1 {
            color: #4b5563;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            min-height: 80px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-boy {
            background: #2563eb;
        }

        .btn-girl {
            background: #ec4899;
        }

        .success-message {
            display: none;
            font-size: 3rem;
            font-weight: bold;
            color: #1d4ed8;
            margin-top: 20px;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>

<canvas id="fireworksCanvas"></canvas>

<div class="game-container">
    <h1 id="gameTitle">What is the baby going to be?</h1>

    <div class="btn-container">
        <button class="btn btn-boy" id="boyBtn">It's a Boy!</button>
        <button class="btn btn-girl" id="girlBtn">It's a Girl!</button>
    </div>

    <div class="success-message" id="successMsg">
        IT'S A BOY! 💙
    </div>
</div>

<script>
const girlBtn = document.getElementById("girlBtn");
const boyBtn = document.getElementById("boyBtn");
const successMsg = document.getElementById("successMsg");
const gameTitle = document.getElementById("gameTitle");

let isMoving = false;

document.addEventListener("mousemove", (e) => {

    const rect = girlBtn.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const distance = Math.hypot(
        e.clientX - centerX,
        e.clientY - centerY
    );

    if (distance < 150) {

        if (!isMoving) {
            girlBtn.style.position = "fixed";
            isMoving = true;
        }

        const padding = 50;

        const x =
            Math.random() *
                (window.innerWidth - rect.width - padding * 2) +
            padding;

        const y =
            Math.random() *
                (window.innerHeight - rect.height - padding * 2) +
            padding;

        girlBtn.style.left = `${x}px`;
        girlBtn.style.top = `${y}px`;
    }
});

girlBtn.addEventListener("click", () => {
    alert("Nice try! 😂");
});

boyBtn.addEventListener("click", () => {

    boyBtn.style.display = "none";
    girlBtn.style.display = "none";
    gameTitle.style.display = "none";

    successMsg.style.display = "block";

    startFireworks();
});

const canvas = document.getElementById("fireworksCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];

class Particle {
    constructor(x, y, dx, dy, color) {
        this.x = x;
        this.y = y;
        this.dx = dx;
        this.dy = dy;
        this.color = color;
        this.life = 100;
    }

    update() {
        this.x += this.dx;
        this.y += this.dy;
        this.dy += 0.03;
        this.life--;
    }

    draw() {
        ctx.globalAlpha = this.life / 100;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function createExplosion(x, y) {

    const colors = [
        "#1d4ed8",
        "#2563eb",
        "#3b82f6",
        "#60a5fa",
        "#93c5fd",
        "#ffffff"
    ];

    for (let i = 0; i < 70; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;

        particles.push(
            new Particle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                colors[Math.floor(Math.random() * colors.length)]
            )
        );
    }
}

function animate() {

    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles = particles.filter(p => p.life > 0);

    particles.forEach(p => {
        p.update();
        p.draw();
    });

    requestAnimationFrame(animate);
}

function startFireworks() {

    setInterval(() => {

        createExplosion(
            Math.random() * canvas.width,
            Math.random() * canvas.height * 0.6
        );

    }, 400);

    window.addEventListener("click", (e) => {

        createExplosion(
            e.clientX,
            e.clientY
        );

    });
}

animate();
</script>

</body>
</html>
